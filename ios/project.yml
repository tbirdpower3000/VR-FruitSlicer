name: VRBrowser
options:
  bundleIdPrefix: io.github.tbirdpower3000
  deploymentTarget:
    iOS: "16.0"
targets:
  VRBrowser:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: VR Browser
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Web pages you open can ask for the camera, for example to track your hand in Fruit Slicer VR. The picture stays on this phone.
        NSMicrophoneUsageDescription: Web pages you open can ask for the microphone.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tbirdpower3000.vrbrowser
        PRODUCT_NAME: VRBrowser
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
